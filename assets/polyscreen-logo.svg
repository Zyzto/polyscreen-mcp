      <rect class="bar" x="10" y="-62" width="48" height="10" rx="5" ry="5" opacity="0.55"/>
      <rect class="dot" x="-78" y="-28" width="156" height="10" rx="5" ry="5"/>
      <rect class="dot" x="-78" y="0" width="128" height="10" rx="5" ry="5"/>
      <rect class="dot" x="-78" y="28" width="142" height="10" rx="5" ry="5"/>
    </g>
    <!-- Lower display (presentation / secondary) -->
    <g transform="translate(8 118) rotate(-2)">
      <rect class="bezel" x="-100" y="-52" width="200" height="104" rx="18" ry="18"/>
      <rect class="glass" x="-82" y="-36" width="164" height="72" rx="10" ry="10"/>
      <rect class="bar" x="-56" y="-8" width="40" height="10" rx="5" ry="5"/>
      <rect class="bar" x="-4" y="-8" width="60" height="10" rx="5" ry="5" opacity="0.7"/>
    </g>
  </g>

