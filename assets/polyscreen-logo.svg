  <defs>
    <style type="text/css"><![CDATA[
      .bezel {
        fill: #E2E2E2;
        stroke: #C0C0C0;
        stroke-width: 5;
        stroke-linejoin: round;
      }
      .glass {
        fill: #F4F4F4;
      }
      .bar {
        fill: #8B6914;
      }
      .dot {
        fill: #C0C0C0;
      }
    ]]></style>
  </defs>

  <!-- Dual displays (silver chrome), hinged handheld silhouette -->
  <g transform="translate(256 165)">
    <!-- Back / secondary display -->
    <g transform="translate(-22 14) rotate(-8)">
      <rect class="bezel" x="-118" y="-108" width="236" height="168" rx="22" ry="22"/>
    </g>
    <!-- Front / primary display -->
    <g transform="rotate(3)">
      <rect class="bezel" x="-118" y="-108" width="236" height="168" rx="22" ry="22"/>
      <rect class="glass" x="-98" y="-88" width="196" height="128" rx="12" ry="12"/>
